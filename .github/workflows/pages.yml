# Builds the game and publishes it to GitHub Pages. The game is a static site:
# songs are analysed in the player's own browser.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Refuse to publish audio
        run: |
          found=$(find dist/client -type f | grep -iE '\.(mp3|wav|flac|ogg|oga|m4a|aac|opus|wma|aiff?)$' || true)
          if [ -n "$found" ]; then
            echo "These audio files would be published:"
            echo "$found"
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
