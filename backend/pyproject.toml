[project]
name = "taiko-backend"
version = "0.1.0"
description = "Taiko beat analysis service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.3",
    "librosa>=0.10.2.post1",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[project.scripts]
taiko-backend = "taiko_backend.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiko_backend"]
