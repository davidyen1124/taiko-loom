[project]
name = "taiko-backend"
version = "1.0.0"
description = "Audio analysis and chart generation service for Taiko Nights"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.3",
    "python-multipart>=0.0.9",
    "librosa>=0.10.2.post1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taiko_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
